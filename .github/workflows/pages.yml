name: Demo (GitHub Pages)

# Static demonstration for clients: https://arua-solucoes-digitais.github.io/arua-central/
# Prerendered pages with sample data from a fresh database (never data/arua.db).
# No server: forms do not save and the restricted area is disabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sample data snapshot (temporary database)
        run: npm run demo:snapshot
      - name: Build static demo
        env:
          ARUA_DEMO_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo
      - name: Pages extras
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
