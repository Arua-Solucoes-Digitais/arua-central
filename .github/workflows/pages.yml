name: Demo (GitHub Pages)

# Static demonstration for clients (sample data from a fresh database, never data/arua.db;
# no server: forms do not save and the restricted area is disabled).
#
# - Push to main: ONLY builds the demo and keeps it as a downloadable artifact (14 days).
#   Nothing is published.
# - Publishing is manual: Actions → "Demo (GitHub Pages)" → Run workflow → type PUBLICAR.
#   Requires GitHub Pages with source "GitHub Actions" (needs a public repo or a paid plan).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Digite PUBLICAR para publicar a demonstração no GitHub Pages (vazio = só gerar)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Sample data snapshot (temporary database)
        run: npm run demo:snapshot
      - name: Build static demo
        env:
          ARUA_DEMO_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo
      - name: Pages extras
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html
      - name: Keep demo for review (not published)
        uses: actions/upload-artifact@v4
        with:
          name: demo-site-${{ github.sha }}
          path: dist/client
          include-hidden-files: true
          retention-days: 14
      - name: Prepare Pages artifact (only when publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLICAR'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLICAR'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
